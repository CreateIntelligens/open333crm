openapi: 3.1.0
info:
  title: Open333 CRM — Partner Ingest API
  version: "1.0.0"
  description: |
    合作方（產品 / 行銷 / 客服）將知識文件推送到 Open333 CRM 知識庫的單筆推送 API。

    **特性**
    - 單筆 doc 一個 HTTP POST（multipart/form-data）
    - 用 **Partner API Key** 認證（永久有效，除非過期或被撤銷）
    - 同 `DocID` 推第二次會走 upsert：依 `Ver` 比較，新版覆寫、同/低版 idempotent skip
    - 附件直接夾在 `Attached` 欄位（可重複多次上傳多檔）

  contact:
    name: Daniel
    email: dy052340@gmail.com

servers:
  - url: https://uat.open333crm.create360.ai/api/v1
    description: UAT（目前 UAT 與 production 共用此網域；正式環境拆分後另行告知）

# ────────────────────────────────────────────────────────────────────────
security:
  - PartnerApiKey: []

paths:
  /knowledge/partner-ingest:
    post:
      summary: 推送單筆知識文件
      description: |
        將一筆 doc 推進知識庫。同 DocID 重複推會走 upsert：
        - DocID 不存在 → `created`
        - DocID 存在且 incoming `Ver` > 現有 → `updated`（覆寫所有欄位、刪除舊附件、寫入新附件、重算向量）
        - DocID 存在且 incoming `Ver` ≤ 現有 → `skipped`（idempotent retry-safe，不做任何事）

        **拼字相容**：若 client 把 `Source` 拼成 `Soruce`，server 端會自動接受。
      operationId: ingestPartnerDoc
      tags: [Partner Ingest]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PartnerIngestRequest"
            encoding:
              Attached:
                contentType: image/png, image/jpeg, application/pdf
      responses:
        "200":
          description: 成功（created / updated / skipped）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSuccessResponse"
              examples:
                created:
                  summary: 新建 (status=created)
                  value:
                    success: true
                    data:
                      status: created
                      articleId: "1d6ac0a5-a96f-41af-b80d-9fb7a9d5049b"
                      externalDocId: "1243"
                      externalVer: 1
                      attachmentsLinked: 1
                updated:
                  summary: 覆寫舊版 (status=updated)
                  value:
                    success: true
                    data:
                      status: updated
                      articleId: "1d6ac0a5-a96f-41af-b80d-9fb7a9d5049b"
                      externalDocId: "1243"
                      externalVer: 2
                      attachmentsLinked: 1
                skipped:
                  summary: 重複 (status=skipped, idempotent)
                  value:
                    success: true
                    data:
                      status: skipped
                      reason: "incoming ver 1 ≤ existing ver 1"
                      articleId: "1d6ac0a5-a96f-41af-b80d-9fb7a9d5049b"
                      externalDocId: "1243"
                      externalVer: 1
                      attachmentsLinked: 0
        "400":
          description: 缺欄位 / 欄位驗證失敗
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                success: false
                error:
                  code: BAD_REQUEST
                  message: DocID is required
        "401":
          description: API key 無效 / 過期 / 被撤銷
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Invalid API key
        "413":
          description: Request body 超過 30MB（單檔 Attached 上限 25MB）
        "500":
          description: Server 內部錯誤
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

# ────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    PartnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: pk_<64-hex>
      description: |
        合作方專用 API key，由 Open333 管理員從後台「設定 → API 金鑰」建立後提供。

        - 格式：`pk_` + 64 個 hex 字元
        - Header：`Authorization: Bearer pk_xxxxxxxxxxxxxx`
        - 過期 / 撤銷後立即失效
        - **此 key 只能呼叫 `/knowledge/partner-ingest`**，無法存取其他 endpoint

  schemas:
    PartnerIngestRequest:
      type: object
      required:
        - DocID
        - Ver
        - VerCreatTime
        - AI_Q
        - AI_A
        - Source
        - IsAttached
      properties:
        DocID:
          type: string
          description: 唯一 ID（同 tenant 內 unique）。重複推同 DocID 會走 upsert
          example: "1243"
        Ver:
          type: string
          description: 版本號（整數字串）。新版（更高）會覆寫舊版；同 / 低版會被跳過
          example: "1"
        VerCreatTime:
          type: string
          description: 版本建立時間，格式 `/Date(<unix-ms>)/`
          example: "/Date(1775703693000)/"
        AI_Q:
          type: string
          description: 問題 / 商品名稱 / 行銷文案標題（→ `title`）
          example: "Open333 智慧電鍋"
        AI_A:
          type: string
          description: 答案 / 商品描述 / 行銷素材內文（→ `content`）
          example: "採用不鏽鋼外殼，10 人份，700W..."
        Source:
          type: string
          description: |
            來源分類（→ `category`）。例：
            - `FAQ(消費者)-常見問答`
            - `商品資料庫-電鍋`
            - `商品資料庫-電風扇`
            - `marketing`

            注意：欄位名拼成 `Soruce`（typo）也接受。
          example: "商品資料庫-電鍋"
        Spec:
          type: string
          description: 結構化規格 JSON 字串（optional）。Parse 失敗會將原始字串保留
          example: '{"產地":"台灣","消耗功率":"700","售價":"3290"}'
        IsAttached:
          type: string
          enum: ["true", "false"]
          description: 是否帶附件
          example: "true"
        Attached:
          type: array
          description: 附件檔（圖片 / PDF）。**可重複此 key 上傳多檔**，例如兩張圖就送兩個 `Attached` 欄位。單檔上限 25MB
          items:
            type: string
            format: binary

    IngestSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [status, articleId, externalDocId, externalVer, attachmentsLinked]
          properties:
            status:
              type: string
              enum: [created, updated, skipped]
              description: |
                - `created`: DocID 不存在，新建
                - `updated`: DocID 存在且 incoming Ver 更高，已覆寫
                - `skipped`: DocID 存在且 Ver ≤ 現有，無變更
            reason:
              type: string
              description: 僅 `skipped` 時有
              example: "incoming ver 1 ≤ existing ver 1"
            articleId:
              type: string
              format: uuid
            externalDocId:
              type: string
              example: "1243"
            externalVer:
              type: integer
              example: 2
            attachmentsLinked:
              type: integer
              description: 本次成功連結的附件數
              example: 1

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: BAD_REQUEST }
            message: { type: string }

tags:
  - name: Partner Ingest
    description: 合作方推送知識文件
