name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint (skip for now)
        run: echo "Linting skipped - configure ESLint in future"
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: 租戶隔離檢查（漏帶 tenantId 的跨租戶洩漏防護）
        run: node scripts/check-tenant-scoping.mjs --strict

      - name: Test (skip for now)
        run: echo "Tests skipped - add tests in future"
        continue-on-error: true
