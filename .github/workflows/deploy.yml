name: Deploy to UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, uat]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to /srv/open333crm
        run: |
          sudo rsync -av --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '*.tar.gz' \
            --exclude '.env.*' \
            . /srv/open333crm/

      - name: Verify env files exist
        working-directory: /srv/open333crm
        run: |
          for f in .env.web .env.api .env.workers; do
            if [ -f "$f" ]; then
              echo "✓ $f exists"
            else
              echo "⚠ $f missing - please create it on the server"
              exit 1
            fi
          done

      - name: Free port 80 if needed
        run: |
          if sudo ss -tlnp | grep -q ':80 '; then
            echo "Port 80 in use, stopping nginx..."
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
          fi

      - name: Build Docker images
        working-directory: /srv/open333crm
        run: docker compose build

      - name: Restart containers
        working-directory: /srv/open333crm
        run: |
          docker compose up -d
          docker image prune -f

      - name: Verify deployment
        working-directory: /srv/open333crm
        run: |
          docker compose ps
          sleep 5
          curl -sf http://localhost:3000 > /dev/null && echo "✓ Web OK" || echo "✗ Web failed"
          curl -sf http://localhost:80 > /dev/null && echo "✓ Caddy OK" || echo "✗ Caddy failed"
