name: Deploy to UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一時間只跑一個部署。checkout 會取觸發這次部署的 commit，沒有這個設定時，排在後面的舊部署
# 會把 UAT 蓋回舊版（2026-10-13：#264 的部署排在 #265、#266 之後，手動取消才沒有退版）。
# 同一組裡排隊中的部署只保留最新一個（較舊的會被自動取消），進行中的部署不中斷，
# 避免 rsync 或重建容器做到一半留下半套版本。
concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, uat]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync code to /srv/open333crm
        run: |
          sudo rsync -av --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '*.tar.gz' \
            --exclude '.env.*' \
            . /srv/open333crm/

      - name: Generate OpenAPI document for this deployment
        working-directory: /srv/open333crm
        run: docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm-slim sh -c 'node --test apps/api/tests/unit/lib/openapi-inventory.test.mjs && node apps/api/src/lib/openapi-inventory.cli.mjs'

      - name: Fix caddy port for UAT (nginx uses 80)
        working-directory: /srv/open333crm
        run: |
          sed -i 's/"80:80"/"8888:80"/' docker-compose.yml
          echo "Caddy port fixed to 8888:80"

      - name: Verify env files exist
        working-directory: /srv/open333crm
        run: |
          for f in .env.web .env.api .env.workers; do
            if [ -f "$f" ]; then
              echo "✓ $f exists"
            else
              echo "⚠ $f missing"
              exit 1
            fi
          done
          if ! grep -qE '^MCP_ALLOWED_ORIGINS=[^[:space:]]' .env.api; then
            echo "✗ MCP_ALLOWED_ORIGINS must be configured in .env.api"
            exit 1
          fi
          echo "✓ MCP_ALLOWED_ORIGINS configured"
          sed -i 's/^AGENTIC_LLM_ENABLED=false/AGENTIC_LLM_ENABLED=true/' .env.api || true
          if ! grep -q '^AGENTIC_LLM_ENABLED=' .env.api; then
            echo "AGENTIC_LLM_ENABLED=true" >> .env.api
          fi
          echo "✓ AGENTIC_LLM_ENABLED configured"
          sudo sed -i 's/^A2A_BRIDGE_ENABLED=.*/A2A_BRIDGE_ENABLED=true/' .env.api || true
          if ! grep -q '^A2A_BRIDGE_ENABLED=' .env.api; then
            echo "A2A_BRIDGE_ENABLED=true" | sudo tee -a .env.api
          fi
          if ! grep -q '^A2A_AGENT_ID=' .env.api; then
            echo "A2A_AGENT_ID=agent-71242d9a435cc6db30814dce" | sudo tee -a .env.api
          else
            sudo sed -i 's/^A2A_AGENT_ID=.*/A2A_AGENT_ID=agent-71242d9a435cc6db30814dce/' .env.api
          fi
          if ! grep -q '^A2A_AGENT_TOKEN=' .env.api; then
            echo "A2A_AGENT_TOKEN=tuHmruMCW2Fppgpz9i6ihE-kputrw7WH2-wNqvugFu8" | sudo tee -a .env.api
          else
            sudo sed -i 's/^A2A_AGENT_TOKEN=.*/A2A_AGENT_TOKEN=tuHmruMCW2Fppgpz9i6ihE-kputrw7WH2-wNqvugFu8/' .env.api
          fi
          if ! grep -q '^A2A_HUB_KEY=' .env.api; then
            echo "A2A_HUB_KEY=ai360" | sudo tee -a .env.api
          else
            sudo sed -i 's/^A2A_HUB_KEY=.*/A2A_HUB_KEY=ai360/' .env.api
          fi
          if ! grep -q '^A2A_HUB_URL=' .env.api; then
            echo "A2A_HUB_URL=https://a2a.david888.com" | sudo tee -a .env.api
          else
            sudo sed -i 's|^A2A_HUB_URL=.*|A2A_HUB_URL=https://a2a.david888.com|' .env.api
          fi
          echo "✓ A2A_BRIDGE configured"
          echo "--- Current A2A env configuration in .env.api ---"
          grep -E '^A2A_' .env.api

      - name: Prune unused Docker build cache (avoid disk fill)
        run: |
          echo "Before prune:"; df -h / | tail -1
          docker builder prune -af
          echo "After prune:"; df -h / | tail -1

      - name: Build Docker images
        working-directory: /srv/open333crm
        run: docker compose build

      - name: Restart containers
        working-directory: /srv/open333crm
        run: |
          docker compose up -d --force-recreate
          docker image prune -f

      - name: Verify deployment
        working-directory: /srv/open333crm
        run: |
          docker compose ps
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then
              echo "✓ API health OK"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3001/health > /dev/null; then
            echo "✗ API health failed"
            docker compose logs --tail=100 api
            exit 1
          fi
          echo "=== Open333CRM API Logs (A2A Bridge & Health) ==="
          docker compose logs --tail=100 api
          curl -fsk https://uat.open333crm.create360.ai/ > /dev/null
          echo "✓ HTTPS OK"
