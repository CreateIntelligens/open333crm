schema: spec-driven

context: |
  ## Project: Open333 CRM

  Read AGENTS.md at the repository root before you plan a change. AGENTS.md is the single
  source of project facts and rules. It covers tenant isolation, the development workflow,
  conventions and commands. The development workflow has four steps: spec, test first,
  structure rules and the definition of done.

  Do not write those facts again in this file or in change artifacts. A second copy becomes
  different from the first copy.

# Per-artifact rules. The OpenSpec skills apply these rules as constraints. The skills do not
# copy the rules into the artifacts. The rules implement step 1 and step 2 of the Development
# Workflow in AGENTS.md.
rules:
  specs:
    - Write each scenario as WHEN / THEN. Name the input and the result that a caller can see, so that a test can check the scenario.
    - Include the failure cases and boundary cases that change behavior. Examples are data of another tenant, missing permissions and invalid input.
    - Before you write a delta, search openspec/specs/ for a requirement that already covers the behavior. If one exists, put the new version under "## MODIFIED Requirements" with the same requirement name. Use "## ADDED Requirements" only for behavior that no requirement covers. An ADDED requirement that contradicts an existing requirement makes the main spec contradict itself after you archive the change.
    - An open change is a change that is not archived yet. Its requirements are not in openspec/specs/. Before you write a delta, also search the delta specs of the open changes in openspec/changes/<name>/specs/. Do not search openspec/changes/archive/. If an open change already adds or modifies the same behavior, do not create a second capability for it. Agree on one capability with the owner of that change. Archive the two changes in order. The change that you archive second uses "## MODIFIED Requirements" for that requirement. If you archive it first, openspec validate passes, but openspec archive stops with "MODIFIED failed ... not found" and changes no file.
    - Each requirement describes one behavior. If the text of a requirement is longer than about 500 characters, check whether it describes several behaviors. If it does, split it into several requirements. A MODIFIED delta replaces the whole requirement, so each later change to a large requirement is also large.
    - A MODIFIED requirement must keep each existing "#### Scenario:" name. If you rename or drop a scenario, openspec validate passes, but openspec archive stops and changes no file.
  tasks:
    - For each scenario, put a task that writes its failing test before the task that implements the scenario.
    - If the code already has the behavior of a scenario, the test cannot fail first. Its test task verifies the test with a mutation instead, as AGENTS.md describes.
    - In each test task, name the test file and the scenario that it covers. The test file is in tests/unit/ or tests/feature/ of the package (see AGENTS.md).
    - End the list with the definition-of-done checks from AGENTS.md. These checks include the CHANGELOG.md update.
